[package]
name = "handflow"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
quick-xml = "0.36"
rand = "0.8.5"
lazy_static = "1.4"
htmlescape = "0.3.1"
once_cell = "1.19.0"
zip = "0.6"
tempfile = "3.3"
actix-web = "4"
actix-files = "0.6"
actix-multipart = "0.4"
futures-util = "0.3"
log = "0.4"
env_logger = "0.11"
tokio = { version = "1", features = ["full"] }
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "AudioContext", "AudioBuffer", "AudioBufferSourceNode", "AudioDestinationNode",
    "GainNode", "DelayNode", "BiquadFilterNode", "AudioParam",
    "AudioNode", "BaseAudioContext", "Window", "Response", "Request",
    "RequestInit", "RequestMode", "ConvolverNode", "OscillatorNode",
    "PannerNode", "BiquadFilterType"
] }
wasm-bindgen-futures = "0.4"